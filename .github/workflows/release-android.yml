name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate tag and application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          match = re.search(r'^version:\s*([^\s#]+)', Path('pubspec.yaml').read_text(), re.M)
          if not match or not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?\+[1-9]\d*', match[1]):
              raise SystemExit('pubspec.yaml must declare version: x.y.z[-prerelease]+positiveBuildNumber')
          version, build_number = match[1].split('+')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Tag must be v{version} to match pubspec.yaml (omit +buildNumber)')
          print(f'Releasing {version}, Android build number {build_number}')
          PY

      - name: Check required signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD DANDANPLAY_APP_ID DANDANPLAY_APP_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name (see docs/releasing.md)"
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Set up Android SDK and components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Command-line tools 16.0 run on the JDK 17 used by this project.
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Verify Android SDK tooling
        run: |
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          flutter --version

      - name: Configure Gradle for hosted runner memory
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError' \
            'org.gradle.workers.max=2' >> "$HOME/.gradle/gradle.properties"

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test test --no-pub
          dart tools/probe_maccms.dart

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'mamba-release.jks'
          path.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          path.chmod(0o600)
          PY

      - name: Build signed Release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mamba-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'dandanplay-defines.json'
          path.write_text(json.dumps({key: os.environ[key] for key in ('DANDANPLAY_APP_ID', 'DANDANPLAY_APP_SECRET')}))
          path.chmod(0o600)
          PY
          # Flutter must regenerate the Release plugin registrant to omit dev plugins.
          flutter build apk --release --split-per-abi --dart-define-from-file="$RUNNER_TEMP/dandanplay-defines.json"
          git diff --exit-code -- pubspec.lock

      - name: Verify and package APKs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts/release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "artifacts/release/mamba-tv-$RELEASE_TAG-$abi.apk"
          done
          cd artifacts/release
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mamba-tv-${{ github.ref_name }}
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" artifacts/release/*.apk artifacts/release/SHA256SUMS.txt \
            --verify-tag --title "Mamba TV $RELEASE_TAG" --generate-notes "${options[@]}"

      - name: Remove signing keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mamba-release.jks" "$RUNNER_TEMP/dandanplay-defines.json"
